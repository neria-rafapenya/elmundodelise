<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Backoffice · El mundo de Lise</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="admin">
  <main class="wrap">
    <h1>Backoffice</h1>
    <div class="admin-tabs">
      <button data-t="products" class="active">Prendas</button>
      <button data-t="orders">Pedidos</button>
      <button data-t="categories">Categorías</button>
    </div>
    <div id="view"><p class="muted">Cargando…</p></div>
  </main>

  <script type="module">
    import { api, renderShell, requireLogin, toast, $, $$, esc, money } from '/js/app.js';
    await renderShell();
    if (!(await requireLogin())) throw 0;
    const me = await api('/me');
    if (!me.profile?.is_admin) { $('#view').innerHTML = '<p class="error">Tu usuario no es administrador.</p>'; throw 0; }

    const STATUS = { pending_payment: 'Pendiente de pago', pending_bizum: 'Pendiente de Bizum', paid: 'Pagado', preparing: 'En preparación', shipped: 'Enviado', delivered: 'Entregado', cancelled: 'Cancelado' };
    let categories = [];
    const views = { products: listProducts, orders: listOrders, categories: listCategories };
    $$('.admin-tabs button').forEach((b) => b.onclick = () => {
      $$('.admin-tabs button').forEach((x) => x.classList.toggle('active', x === b));
      views[b.dataset.t]();
    });
    const loadCats = async () => (categories = await api('/categories'));
    await loadCats();
    listProducts();

    // ---------------- PRENDAS ----------------
    async function listProducts() {
      const items = await api('/admin/products');
      $('#view').innerHTML = `
        <div class="toolbar"><span class="muted">${items.length} prenda(s)</span><button class="btn" id="new">+ Nueva prenda</button></div>
        <table><thead><tr><th></th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Estado</th><th></th></tr></thead><tbody>
        ${items.map((p) => `<tr>
          <td>${p.images[0] ? `<img class="mini" src="${esc(p.images[0].path)}" alt="">` : ''}</td>
          <td><strong>${esc(p.name)}</strong><div class="muted" style="font-size:.8rem">${esc(categories.find((c) => c.id === p.category_id)?.name || 'Sin categoría')}</div></td>
          <td>${money(p.price_cents)}</td>
          <td>${p.variants.reduce((s, v) => s + v.stock, 0)} <span class="muted">(${p.variants.length} tallas)</span></td>
          <td>${p.active ? '<span class="status paid">Visible</span>' : '<span class="status">Oculta</span>'}</td>
          <td><button class="btn small ghost" data-edit="${p.id}">Editar</button></td>
        </tr>`).join('') || '<tr><td colspan="6" class="muted center">Aún no hay prendas. Crea la primera.</td></tr>'}
        </tbody></table>`;
      $('#new').onclick = () => editProduct(null);
      $$('[data-edit]').forEach((b) => b.onclick = () => editProduct(items.find((p) => p.id === b.dataset.edit)));
    }

    async function reloadProduct(id) {
      return (await api('/admin/products')).find((p) => p.id === id);
    }

    function editProduct(p) {
      const isNew = !p;
      p = p || { name: '', description: '', price_cents: 0, active: true, category_id: '', images: [], variants: [] };
      $('#view').innerHTML = `
        <p><button class="link-btn" id="back" style="margin:0">← Volver al listado</button></p>
        <div class="two-col" style="padding-top:12px">
          <form class="box" id="pf">
            <h2>${isNew ? 'Nueva prenda' : 'Editar prenda'}</h2>
            <div class="field"><label>Nombre *</label><input name="name" value="${esc(p.name)}" required></div>
            <div class="row">
              <div class="field"><label>Precio (€) *</label><input name="price" inputmode="decimal" value="${isNew ? '' : (p.price_cents / 100).toFixed(2).replace('.', ',')}" required></div>
              <div class="field"><label>Categoría</label><select name="category_id"><option value="">Sin categoría</option>${categories.map((c) => `<option value="${c.id}" ${c.id === p.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
            </div>
            <div class="field"><label>Descripción</label><textarea name="description" rows="6">${esc(p.description || '')}</textarea></div>
            <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="active" ${p.active ? 'checked' : ''} style="width:auto"> Visible en la tienda</label>
            <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
              <button class="btn">${isNew ? 'Crear y añadir fotos' : 'Guardar cambios'}</button>
              ${isNew ? '' : `<a class="btn ghost" href="/producto.html?p=${esc(p.slug)}" target="_blank">Ver en tienda</a><button type="button" class="btn danger" id="del">Eliminar</button>`}
            </div>
          </form>
          <div class="stack" id="side">${isNew ? '<p class="muted">Guarda la prenda para poder añadir fotos y tallas.</p>' : ''}</div>
        </div>`;
      $('#back').onclick = listProducts;

      $('#pf').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = Object.fromEntries(new FormData(e.target));
        const body = { name: f.name, price: f.price, category_id: f.category_id, description: f.description, active: !!f.active };
        try {
          const saved = isNew ? await api('/admin/products', { method: 'POST', body }) : await api(`/admin/products/${p.id}`, { method: 'PUT', body });
          toast('Guardado');
          editProduct(await reloadProduct(saved.id));
        } catch (err) { toast(err.message, 'err'); }
      });

      $('#del')?.addEventListener('click', async () => {
        if (!confirm(`¿Eliminar "${p.name}" y todas sus fotos? Esta acción no se puede deshacer.`)) return;
        try { await api(`/admin/products/${p.id}`, { method: 'DELETE' }); toast('Prenda eliminada'); listProducts(); }
        catch (err) { toast(err.message, 'err'); }
      });

      if (!isNew) renderSide(p);
    }

    function renderSide(p) {
      $('#side').innerHTML = `
        <div class="box">
          <h2>Fotos</h2>
          <div class="img-grid">${p.images.map((im, i) => `
            <figure><img src="${esc(im.path)}" alt="">
              <figcaption>
                <span>${i === 0 ? '<small class="muted">Principal</small>' : `<button class="link-btn" style="margin:0" data-first="${im.id}">Principal</button>`}</span>
                <button class="link-btn" style="margin:0;color:var(--err)" data-delimg="${im.id}">Borrar</button>
              </figcaption></figure>`).join('')}</div>
          <label class="drop" id="drop" style="margin-top:14px">Arrastra fotos aquí o haz clic para elegirlas<br><small>JPG, PNG o WEBP · máx. 8 MB</small>
            <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple hidden></label>
        </div>
        <div class="box">
          <h2>Tallas y stock</h2>
          <table><thead><tr><th>Talla</th><th>Color</th><th>Stock</th><th></th></tr></thead><tbody>
            ${p.variants.map((v) => `<tr data-v="${v.id}">
              <td><input name="size" value="${esc(v.size || '')}"></td><td><input name="color" value="${esc(v.color || '')}"></td>
              <td><input name="stock" type="number" min="0" value="${v.stock}" style="width:80px"></td>
              <td style="white-space:nowrap"><button class="btn small ghost" data-savev>Guardar</button> <button class="link-btn" style="color:var(--err)" data-delv>Borrar</button></td></tr>`).join('')}
            <tr id="newv"><td><input name="size" placeholder="S, M, 38…"></td><td><input name="color" placeholder="Opcional"></td>
              <td><input name="stock" type="number" min="0" value="1" style="width:80px"></td><td><button class="btn small" id="addv">Añadir</button></td></tr>
          </tbody></table>
          <p class="muted" style="font-size:.82rem;margin-top:8px">Si la prenda es de talla única, añade una sola fila con «Única».</p>
        </div>`;

      const refresh = async () => renderSide(await reloadProduct(p.id));
      const val = (tr, n) => tr.querySelector(`[name=${n}]`).value;

      // Fotos
      const upload = async (fileList) => {
        const files = [...fileList].filter((f) => /^image\/(jpeg|png|webp)$/.test(f.type));
        if (!files.length) return toast('Formato no válido', 'err');
        const form = new FormData(); files.forEach((f) => form.append('images', f));
        $('#drop').firstChild.textContent = 'Subiendo…';
        try { await api(`/admin/products/${p.id}/images`, { method: 'POST', form }); toast('Fotos subidas'); }
        catch (err) { toast(err.message, 'err'); }
        refresh();
      };
      $('#files').onchange = (e) => upload(e.target.files);
      const drop = $('#drop');
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
      drop.ondragleave = () => drop.classList.remove('over');
      drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); upload(e.dataTransfer.files); };
      $$('[data-delimg]').forEach((b) => b.onclick = async () => {
        if (!confirm('¿Borrar esta foto?')) return;
        await api(`/admin/images/${b.dataset.delimg}`, { method: 'DELETE' }); refresh();
      });
      $$('[data-first]').forEach((b) => b.onclick = async () => {
        const min = Math.min(...p.images.map((i) => i.sort));
        await api(`/admin/images/${b.dataset.first}`, { method: 'PUT', body: { sort: min - 1 } }); refresh();
      });

      // Tallas
      $('#addv').onclick = async () => {
        const tr = $('#newv');
        try { await api(`/admin/products/${p.id}/variants`, { method: 'POST', body: { size: val(tr, 'size'), color: val(tr, 'color'), stock: val(tr, 'stock') } }); toast('Talla añadida'); refresh(); }
        catch (err) { toast(err.message, 'err'); }
      };
      $$('[data-savev]').forEach((b) => b.onclick = async () => {
        const tr = b.closest('tr');
        try { await api(`/admin/variants/${tr.dataset.v}`, { method: 'PUT', body: { size: val(tr, 'size'), color: val(tr, 'color'), stock: val(tr, 'stock') } }); toast('Guardado'); }
        catch (err) { toast(err.message, 'err'); }
      });
      $$('[data-delv]').forEach((b) => b.onclick = async () => {
        if (!confirm('¿Borrar esta talla?')) return;
        await api(`/admin/variants/${b.closest('tr').dataset.v}`, { method: 'DELETE' }); refresh();
      });
    }

    // ---------------- PEDIDOS ----------------
    async function listOrders(filter = '') {
      const orders = await api('/admin/orders' + (filter ? `?status=${filter}` : ''));
      $('#view').innerHTML = `
        <div class="toolbar">
          <select id="flt" style="max-width:260px"><option value="">Todos los estados</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === filter ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <span class="muted">${orders.length} pedido(s)</span>
        </div>
        <table><thead><tr><th>Nº</th><th>Fecha</th><th>Cliente</th><th>Artículos</th><th>Total</th><th>Pago</th><th>Estado</th></tr></thead><tbody>
        ${orders.map((o) => `<tr>
          <td><strong>${o.number}</strong></td>
          <td>${new Date(o.created_at).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' })}</td>
          <td>${esc(o.ship_name)}<div class="muted" style="font-size:.8rem">${esc(o.email || '')}${o.ship_phone ? ' · ' + esc(o.ship_phone) : ''}<br>${esc(o.ship_address)}, ${esc(o.ship_postal_code)} ${esc(o.ship_city)}</div>
            ${o.notes ? `<div style="font-size:.8rem;color:var(--warn)">📝 ${esc(o.notes)}</div>` : ''}</td>
          <td style="font-size:.85rem">${o.elise_order_items.map((i) => `${i.qty}× ${esc(i.name)} ${esc(i.size || '')}`).join('<br>')}</td>
          <td>${money(o.total_cents)}</td>
          <td>${o.payment_method === 'bizum' ? 'Bizum' : 'PayPal'}</td>
          <td><select data-o="${o.id}">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${v}</option>`).join('')}</select>
            <input data-track="${o.id}" placeholder="Nº seguimiento" value="${esc(o.tracking || '')}" style="margin-top:6px;font-size:.8rem"></td>
        </tr>`).join('') || '<tr><td colspan="7" class="muted center">No hay pedidos.</td></tr>'}
        </tbody></table>`;
      $('#flt').onchange = (e) => listOrders(e.target.value);
      $$('[data-o]').forEach((s) => s.onchange = async () => {
        if (s.value === 'paid' && !confirm('¿Confirmas que has recibido el pago? Se descontará el stock.')) return listOrders(filter);
        try { await api(`/admin/orders/${s.dataset.o}`, { method: 'PATCH', body: { status: s.value } }); toast('Estado actualizado'); }
        catch (err) { toast(err.message, 'err'); listOrders(filter); }
      });
      $$('[data-track]').forEach((i) => i.onchange = async () => {
        try { await api(`/admin/orders/${i.dataset.track}`, { method: 'PATCH', body: { tracking: i.value } }); toast('Seguimiento guardado'); }
        catch (err) { toast(err.message, 'err'); }
      });
    }

    // ---------------- CATEGORÍAS ----------------
    async function listCategories() {
      await loadCats();
      $('#view').innerHTML = `
        <div class="box" style="max-width:560px">
          <table><tbody>${categories.map((c) => `<tr><td>${esc(c.name)}</td><td style="text-align:right"><button class="link-btn" style="color:var(--err)" data-delc="${c.id}">Borrar</button></td></tr>`).join('')}</tbody></table>
          <form id="cf" style="display:flex;gap:10px;margin-top:16px"><input name="name" placeholder="Nueva categoría" required><button class="btn">Añadir</button></form>
        </div>`;
      $('#cf').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await api('/admin/categories', { method: 'POST', body: { name: e.target.name.value, sort: categories.length + 1 } }); listCategories(); }
        catch (err) { toast(err.message, 'err'); }
      });
      $$('[data-delc]').forEach((b) => b.onclick = async () => {
        if (!confirm('¿Borrar la categoría? Las prendas quedarán sin categoría.')) return;
        await api(`/admin/categories/${b.dataset.delc}`, { method: 'DELETE' }); listCategories();
      });
    }
  </script>
</body>
</html>
