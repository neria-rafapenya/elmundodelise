<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta · El mundo de Lise</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="wrap" id="main"></main>

  <script type="module">
    import { api, config, renderShell, getUser, toast, $, $$, esc, money, params } from '/js/app.js';
    await renderShell();
    const next = params.get('next');
    const STATUS = { pending_payment: 'Pendiente de pago', pending_bizum: 'Pendiente de Bizum', paid: 'Pagado', preparing: 'En preparación', shipped: 'Enviado', delivered: 'Entregado', cancelled: 'Cancelado' };
    const done = () => (location.href = next || '/cuenta.html');

    const user = await getUser();
    if (params.get('reset')) renderReset(params.get('reset'));
    else if (user) { if (next) location.href = next; else renderAccount(user); }
    else renderAuth('login');

    function renderAuth(mode) {
      $('#main').innerHTML = `
        <div class="auth-box box">
          <div class="tabs"><button data-m="login" class="${mode === 'login' ? 'active' : ''}">Entrar</button><button data-m="signup" class="${mode === 'signup' ? 'active' : ''}">Crear cuenta</button></div>
          <form id="f" novalidate>
            ${mode === 'signup' ? '<div class="field"><label>Nombre y apellidos</label><input name="full_name" autocomplete="name"></div>' : ''}
            <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div>
            <div class="field"><label>Contraseña</label><input name="password" type="password" required minlength="8" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}"></div>
            ${mode === 'signup' ? '<label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);margin-bottom:14px"><input type="checkbox" name="accept" style="width:auto;margin-top:4px"> <span>Acepto que mis datos se usen para gestionar mis pedidos.</span></label>' : ''}
            <p class="error" id="err"></p>
            <button class="btn block">${mode === 'login' ? 'Entrar' : 'Crear cuenta'}</button>
            ${mode === 'login' && config.passwordReset ? '<p class="center" style="margin-top:14px"><button type="button" class="link-btn" id="forgot" style="margin:0">¿Has olvidado la contraseña?</button></p>' : ''}
          </form>
        </div>`;
      $$('.tabs button').forEach((b) => b.onclick = () => renderAuth(b.dataset.m));

      $('#forgot')?.addEventListener('click', async () => {
        const email = $('[name=email]').value.trim();
        if (!email) return ($('#err').textContent = 'Escribe tu email y vuelve a pulsar.');
        try { await api('/auth/forgot', { method: 'POST', body: { email } }); toast('Si el email existe, te hemos enviado un enlace'); }
        catch (e) { $('#err').textContent = e.message; }
      });

      $('#f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = Object.fromEntries(new FormData(e.target));
        $('#err').textContent = '';
        const btn = e.target.querySelector('.btn'); btn.disabled = true;
        try {
          if (mode === 'signup') await api('/auth/register', { method: 'POST', body: { ...f, accept: !!f.accept } });
          else await api('/auth/login', { method: 'POST', body: f });
          done();
        } catch (err) { $('#err').textContent = err.message; btn.disabled = false; }
      });
    }

    function renderReset(token) {
      $('#main').innerHTML = `<div class="auth-box box"><h2>Nueva contraseña</h2>
        <form id="np"><div class="field"><input name="password" type="password" minlength="8" required placeholder="Mínimo 8 caracteres" autocomplete="new-password"></div>
        <p class="error" id="err"></p><button class="btn block">Guardar</button></form></div>`;
      $('#np').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await api('/auth/reset', { method: 'POST', body: { token, password: e.target.password.value } }); toast('Contraseña actualizada'); setTimeout(() => location.href = '/cuenta.html', 900); }
        catch (err) { $('#err').textContent = err.message; }
      });
    }

    async function renderAccount(p) {
      const orders = await api('/me/orders');
      $('#main').innerHTML = `
        <div class="two-col">
          <section>
            <h1>Hola${p.full_name ? ', ' + esc(p.full_name.split(' ')[0]) : ''}</h1>
            <h2>Mis pedidos</h2>
            ${orders.length ? orders.map((o) => `
              <div class="order">
                <a href="/pedido.html?id=${o.id}"><strong>Pedido nº ${o.number}</strong></a>
                <span class="status ${o.status}">${STATUS[o.status]}</span>
                <div class="muted" style="font-size:.9rem">${new Date(o.created_at).toLocaleDateString('es-ES')} · ${money(o.total_cents)} · ${o.items.reduce((s, i) => s + i.qty, 0)} artículo(s)</div>
              </div>`).join('') : '<p class="muted">Todavía no has hecho ningún pedido. <a href="/">Ver la tienda</a></p>'}
            ${p.is_admin ? '<p style="margin-top:28px"><a class="btn ghost" href="/admin/">Ir al backoffice</a></p>' : ''}
          </section>
          <aside class="stack">
            <form class="box" id="pf">
              <h2>Mis datos</h2>
              <div class="field"><label>Email</label><input value="${esc(p.email)}" disabled></div>
              <div class="field"><label>Nombre y apellidos</label><input name="full_name" value="${esc(p.full_name || '')}"></div>
              <div class="field"><label>Teléfono</label><input name="phone" value="${esc(p.phone || '')}"></div>
              <div class="field"><label>Dirección</label><input name="address" value="${esc(p.address || '')}"></div>
              <div class="row">
                <div class="field"><label>C. postal</label><input name="postal_code" value="${esc(p.postal_code || '')}"></div>
                <div class="field"><label>Población</label><input name="city" value="${esc(p.city || '')}"></div>
              </div>
              <div class="field"><label>Provincia</label><input name="province" value="${esc(p.province || '')}"></div>
              <button class="btn block">Guardar</button>
            </form>
            <form class="box" id="pw">
              <h2>Cambiar contraseña</h2>
              <div class="field"><label>Contraseña actual</label><input name="current" type="password" autocomplete="current-password"></div>
              <div class="field"><label>Nueva contraseña</label><input name="password" type="password" minlength="8" autocomplete="new-password"></div>
              <button class="btn ghost block">Cambiar</button>
            </form>
            <button class="btn ghost block" id="logout">Cerrar sesión</button>
          </aside>
        </div>`;
      $('#pf').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await api('/me', { method: 'PUT', body: Object.fromEntries(new FormData(e.target)) }); toast('Datos guardados'); }
        catch (err) { toast(err.message, 'err'); }
      });
      $('#pw').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { await api('/auth/password', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); toast('Contraseña cambiada'); e.target.reset(); }
        catch (err) { toast(err.message, 'err'); }
      });
      $('#logout').onclick = async () => { await api('/auth/logout', { method: 'POST' }); location.href = '/'; };
    }
  </script>
</body>
</html>
