<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El mundo de Lise</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="wrap" id="main"><p class="muted center" style="padding:60px 0">Cargando…</p></main>

  <script type="module">
    import { api, renderShell, cart, toast, $, $$, esc, money, params } from '/js/app.js';
    await renderShell();

    let p;
    try { p = await api(`/products/${encodeURIComponent(params.get('p') || '')}`); }
    catch { $('#main').innerHTML = '<p class="center" style="padding:60px 0">Producto no encontrado. <a href="/">Volver a la tienda</a></p>'; throw 0; }

    document.title = `${p.name} · El mundo de Lise`;
    const label = (v) => [v.size, v.color].filter(Boolean).join(' · ') || 'Única';
    const single = p.variants.length === 1;

    $('#main').innerHTML = `
      <div class="product">
        <div class="gallery">
          <div class="main">${p.images[0] ? `<img id="big" src="${esc(p.images[0].path)}" alt="${esc(p.name)}">` : ''}</div>
          ${p.images.length > 1 ? `<div class="thumbs">${p.images.map((im, i) => `<img src="${esc(im.path)}" data-i="${i}" class="${i ? '' : 'active'}" alt="">`).join('')}</div>` : ''}
        </div>
        <div>
          <p class="muted"><a href="/">Tienda</a></p>
          <h1>${esc(p.name)}</h1>
          <div class="price">${money(p.price_cents)}</div>
          ${p.variants.length ? `
            <label>${single ? 'Talla' : 'Elige talla'}</label>
            <div class="sizes">${p.variants.map((v) => `<button class="size ${single && v.stock > 0 ? 'active' : ''}" data-id="${v.id}" ${v.stock > 0 ? '' : 'disabled'}>${esc(label(v))}</button>`).join('')}</div>
            <button class="btn block" id="add" ${p.in_stock ? '' : 'disabled'}>${p.in_stock ? 'Añadir al carrito' : 'Agotado'}</button>
            <p class="muted" id="stockinfo" style="font-size:.85rem;margin-top:8px"></p>`
          : '<p class="muted">Este producto todavía no tiene tallas disponibles.</p>'}
          ${p.description ? `<div class="desc">${esc(p.description)}</div>` : ''}
        </div>
      </div>`;

    $$('.thumbs img').forEach((t) => t.onclick = () => {
      $('#big').src = t.src; $$('.thumbs img').forEach((x) => x.classList.toggle('active', x === t));
    });

    let selected = single && p.variants[0].stock > 0 ? p.variants[0].id : null;
    $$('.size').forEach((b) => b.onclick = () => {
      selected = b.dataset.id;
      $$('.size').forEach((x) => x.classList.toggle('active', x === b));
      const v = p.variants.find((x) => x.id === selected);
      $('#stockinfo').textContent = v.stock <= 3 ? `¡Solo quedan ${v.stock}!` : '';
    });

    $('#add')?.addEventListener('click', () => {
      if (!selected) return toast('Elige una talla', 'err');
      const v = p.variants.find((x) => x.id === selected);
      const inCart = cart.get().find((i) => i.variant_id === selected)?.qty || 0;
      if (inCart + 1 > v.stock) return toast('No hay más unidades de esta talla', 'err');
      cart.add(selected, 1);
      toast('Añadido al carrito');
    });
  </script>
</body>
</html>
